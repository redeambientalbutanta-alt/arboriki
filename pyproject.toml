[project]
name = "arboriki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pr0s4", email = "pedro.souza.rosa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "d3blocks>=2.0.0",
    "lxml>=6.1.3",
    "neo4j>=6.3.0",
    "pdf2image>=1.17.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
]

[project.scripts]
arboriki = "arboriki.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
