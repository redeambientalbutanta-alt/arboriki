name: Publicar wiki no GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # histórico completo, necessário para as datas "última modificação" do Quartz

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache de dependências npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências
        run: npm ci

      - name: Garantir permissão de execução do CLI do Quartz
        # checkouts feitos no Windows (core.filemode=false) podem commitar este
        # arquivo sem +x; sem isso, "npx quartz" falha com "Permission denied".
        run: chmod +x quartz/bootstrap-cli.mjs

      - name: Instalar plugins do Quartz
        run: npx quartz plugin install --from-config

      - name: Copiar wiki/ para content/ (fonte da verdade é wiki/, não site/content/)
        run: npm run sync

      - name: Build do site
        run: npx quartz build

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
